<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="280" height="70">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A2550" flood-opacity="0.25"/>
    </filter>

    <!-- Clip Path for outer rounded container (radius 10px) -->
    <clipPath id="btnContainerClip">
      <rect x="10" y="10" width="300" height="60" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g filter="url(#btnShadow)">
    <g clip-path="url(#btnContainerClip)">
      <!-- Left Blue Section (75% width) -->
      <rect x="10" y="10" width="220" height="60" fill="#243C9A"/>

      <!-- "Download" Monospace Text with Underline -->
      <text x="32" y="47" fill="#FFFFFF" font-family="'Courier New', Courier, 'Fira Code', monospace" font-size="27" font-weight="600" letter-spacing="1.2">Download</text>
      <line x1="30" y1="53" x2="200" y2="53" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Right Light Section (25% width) -->
      <rect x="230" y="10" width="80" height="60" fill="#E6E8F3"/>

      <!-- Downward Arrow Icon (Dark Blue) -->
      <g stroke="#243C9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="270" y1="30" x2="270" y2="50"/>
        <polyline points="263,43 270,50 277,43"/>
      </g>
    </g>
  </g>
</svg>
