<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="280" height="78">
  <defs>
    <!-- Blue Cyan Gradient for Circle -->
    <linearGradient id="blueCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="100%" stop-color="#0077CC"/>
    </linearGradient>
    <!-- Subtle Drop Shadow -->
    <filter id="btnShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#btnShadow)">
    <!-- Black Capsule Body -->
    <rect x="15" y="22" width="260" height="56" rx="28" ry="28" fill="#000000"/>

    <!-- "Download" Text -->
    <text x="50" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5">Download</text>

    <!-- Overlapping Blue Circle -->
    <circle cx="280" cy="50" r="42" fill="url(#blueCircleGrad)"/>

    <!-- White Downward Arrow -->
    <g fill="#FFFFFF">
      <path d="M 271 36 L 289 36 L 289 52 L 301 52 L 280 72 L 259 52 L 271 52 Z"/>
    </g>
  </g>
</svg>
