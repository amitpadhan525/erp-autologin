name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.2.0 or v2.2.0). Leave empty to use version from app/build.gradle'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Determine Version
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
            VER="${RAW_VER#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep -oP 'versionName\s+"?\K[^"]+' app/build.gradle | tr -d ' "')
          fi

          TAG="v${VER}"
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "Resolved Version: ${VER}"
          echo "Resolved Tag Name: ${TAG}"

      - name: Prepare Signing Keystore (Optional)
        id: prepare_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Found RELEASE_KEYSTORE_BASE64 secret, decoding keystore..."
            KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=${KEYSTORE_PATH}" >> $GITHUB_ENV
          else
            echo "No custom keystore provided. Will use default debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Package Release Assets
        id: package_assets
        run: |
          mkdir -p dist

          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: No release APK found at $APK_PATH"
            exit 1
          fi

          VERSIONED_APK="dist/erp-autologin-${TAG_NAME}.apk"
          GENERIC_APK="dist/erp-autologin.apk"

          cp "$APK_PATH" "$VERSIONED_APK"
          cp "$APK_PATH" "$GENERIC_APK"

          cd dist
          sha256sum "erp-autologin-${TAG_NAME}.apk" > "erp-autologin-${TAG_NAME}.apk.sha256"
          sha256sum "erp-autologin.apk" > "erp-autologin.apk.sha256"
          cd ..

          echo "Prepared artifacts:"
          ls -lh dist/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-autologin-${{ env.TAG_NAME }}
          path: dist/*
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.TAG_NAME }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          EXTRA_FLAGS=()
          if [ "$IS_DRAFT" = "true" ]; then
            EXTRA_FLAGS+=("--draft")
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Uploading new assets..."
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            echo "Creating new release for $TAG_NAME..."
            gh release create "$TAG_NAME" dist/* \
              --title "GIET ERP Auto-Login ${TAG_NAME}" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
