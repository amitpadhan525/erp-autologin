plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giet.erp'
    compileSdk 35

    defaultConfig {
        applicationId "com.giet.erp"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "2.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def keystorePath = System.getenv("KEYSTORE_FILE")
    def hasKeystore = keystorePath != null && !keystorePath.trim().isEmpty() && file(keystorePath).exists()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Google ML Kit On-Device OCR for offline CAPTCHA recognition fallback
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // High-Accuracy On-Device Neural Network Inference (ONNX Runtime)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // RecyclerView (referenced in activity_main.xml)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

